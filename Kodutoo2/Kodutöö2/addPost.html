<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Add Post</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <section class="nav-links">
        <a href="index.html">Home</a>
        <a href="addPost.html">Add Post</a>
      </section>
      <div class="profile">
        <button class="profile-button" id="profileButton" type="button"
                aria-label="Open profile menu" aria-controls="profileMenu" aria-expanded="false">
          <img src="assets/avatar.svg" alt="User profile">
        </button>
        <div class="profile-menu" id="profileMenu" hidden>
          <strong>Robin</strong>
          <span>robinmathias2006@gmail.com</span>
          <a href="login.html">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="form-page">
    <section class="form-card">
      <h1>Add a post</h1>
      <form id="addPostForm">
        <label for="post-body">Post body</label>
        <textarea id="post-body" name="post-body" rows="6"
                  placeholder="Write your post here..." required></textarea>

        <label for="post-file">Select file</label>
        <input id="post-file" name="post-file" type="file" accept="image/*">

        <button type="submit">Create post</button>
      </form>
    </section>
  </main>
</body>
</html>
