<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <section class="nav-links">
        <a href="index.html">Home</a>
        <a href="addPost.html">Add Post</a>
      </section>
      <div class="profile">
        <button class="profile-button" id="profileButton" type="button"
                aria-label="Open profile menu" aria-controls="profileMenu" aria-expanded="false">
          <img src="assets/avatar.svg" alt="User profile">
        </button>
        <div class="profile-menu" id="profileMenu" hidden>
          <strong>Robin</strong>
          <span>robinmathias2006@gmail.com</span>
          <a href="login.html">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  
  <main class="page-layout">
    <aside class="side-panel left-panel"></aside>

    <!-- Postitused lisatakse JavaScriptiga -->
    <section class="feed" id="posts" aria-label="Posts">
      <p class="feed-status">Loading posts...</p>
    </section>

    <aside class="side-panel right-panel"></aside>
  </main>

  <footer>
    <p>© 2026 PostIt</p>
  </footer>

</html>
