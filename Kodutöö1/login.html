<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lehe ülemine osa ja navigeerimine -->
  <header class="site-header">
    <nav class="navbar">
      <section class="nav-links">
        <a href="index.html">Home</a>
        <a href="addPost.html">Add Post</a>
      </section>
      <a class="profile-link" href="login.html" aria-label="Login">
        <img src="assets/avatar.svg" alt="User profile">
      </a>
    </nav>
  </header>

  <!-- Sisselogimise vorm -->
  <main class="form-page">
    <section class="form-card login-card">
      <h1>Welcome to PostIt</h1>
      <a class="account-link" href="#">Create an account</a>
      <p>or</p>
      <p>Please log in</p>

      <!-- Mõlemad väljad on required ehk kohustuslikud -->
      <form action="index.html" method="get">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required>

        <button type="submit">Log in</button>
      </form>

      <a class="account-link" href="#">Forget password</a>
    </section>
  </main>
</body>
</html>
